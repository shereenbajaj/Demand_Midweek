<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Demand Midweek Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f6f5;--surface:#ffffff;--surface-2:#eef2f0;--ink:#101a17;--ink-2:#4a5752;--ink-3:#77837e;
  --line:#dde4e1;--grid:#e9eeec;--accent:#0b6b5c;--accent-soft:#dcefe9;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --pos:#2a78d6;--neg:#e34948;--mid:#f0efec;
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;
  --good-bg:#e5f4e5;--warn-bg:#fdf1d6;--crit-bg:#fbe6e6;--neutral-bg:#eef1f0;
  --shadow:0 1px 2px rgba(16,26,23,.05),0 4px 16px rgba(16,26,23,.04);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0e1312;--surface:#151b19;--surface-2:#1c2421;--ink:#edf3f0;--ink-2:#a7b4af;--ink-3:#76837e;
  --line:#28322f;--grid:#212a27;--accent:#45b9a2;--accent-soft:#18332d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--pos:#3987e5;--neg:#e66767;--mid:#383835;
  --good-bg:#15301a;--warn-bg:#352a10;--crit-bg:#3a1a1a;--neutral-bg:#212a27;--shadow:none;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0e1312;--surface:#151b19;--surface-2:#1c2421;--ink:#edf3f0;--ink-2:#a7b4af;--ink-3:#76837e;
  --line:#28322f;--grid:#212a27;--accent:#45b9a2;--accent-soft:#18332d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--pos:#3987e5;--neg:#e66767;--mid:#383835;
  --good-bg:#15301a;--warn-bg:#352a10;--crit-bg:#3a1a1a;--neutral-bg:#212a27;--shadow:none;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.weekpick{display:flex;align-items:center;gap:6px}
.weekpick .wklab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-right:4px}
.weekpick #wkbtn,.weekpick button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px}
.wk{position:relative}
.weekpick #wkbtn{width:auto;min-width:132px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px;font-weight:500}
.weekpick #wkbtn .car{color:var(--ink-3);font-size:11px}
.wkmenu{position:absolute;top:calc(100% + 6px);right:0;width:220px;max-height:min(360px,60vh);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;z-index:20}
.wkmenu .mh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;padding:8px 8px 4px}
.wkmenu .opt{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;color:var(--ink);background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer;text-align:left}
.wkmenu .opt:hover,.wkmenu .opt:focus-visible{background:var(--surface-2);outline:none}
.wkmenu .opt[aria-selected="true"]{background:var(--accent-soft);font-weight:600}
.wkmenu .opt small{color:var(--ink-3);font-size:11px;font-weight:400}
.weekpick > button{width:34px;padding:0;cursor:pointer;font-size:16px}
.weekpick button:disabled{opacity:.35;cursor:default}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{font:inherit;font-weight:500;color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:22px;display:grid;gap:22px}
.pagehead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.pagehead h2{font-size:26px;font-weight:700;letter-spacing:-.015em}
.pagehead .sub{color:var(--ink-2)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:16px;font-weight:700}
.panel .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.panel .ph p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px;max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.tile .lab{font-size:12px;color:var(--ink-2);font-weight:500}
.tile .val{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tile .chips{flex-direction:column;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;border-radius:999px;padding:2px 8px;background:var(--neutral-bg);color:var(--ink);white-space:nowrap}
.chip .ic{font-size:10px}
.chip.good{background:var(--good-bg)}.chip.good .ic{color:var(--good)}
.chip.warn{background:var(--warn-bg)}.chip.warn .ic{color:var(--warn)}
.chip.crit{background:var(--crit-bg)}.chip.crit .ic{color:var(--crit)}
.chip .k{color:var(--ink-3);font-weight:400}
.spark{height:34px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
@media (max-width:420px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.mini h4{margin:0 0 2px;font-size:13px;font-weight:600}
.mini .mv{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);white-space:nowrap;z-index:3;min-width:130px}
.tip b{display:block;font-weight:600;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .r span:first-child{color:var(--ink-2);display:flex;align-items:center;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--ink-3) 0 4px,transparent 4px 7px)!important;height:2px}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;background:var(--surface)}
td.sel,th.sel{background:var(--accent-soft)}
tr.grp td{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding-top:14px;border-bottom:0;background:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.segname{display:flex;align-items:center;gap:8px;font-weight:600}
.tipgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tipgrid>div{min-width:0}
@media (max-width:560px){.tipgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel.col{display:flex;flex-direction:column}
.chart.fill{flex:1;min-height:230px}
.tstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.tstats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tstats span{font-size:11.5px;color:var(--ink-3)}
.tstats b{font-family:var(--display);font-size:18px;font-weight:700}
.tstats small{font-size:11px;color:var(--ink-3)}
@media (max-width:560px){.tstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{min-width:0}
.avgk{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:8px;white-space:nowrap}

.loadmsg{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--ink-2);z-index:40}
.wfhead .chip{vertical-align:1px}
.wfhead{margin:0 0 6px;font-size:14px;max-width:62ch}
.wfhead .dnc{color:var(--crit)}.wfhead .upc{color:var(--good)}
.wfdet{display:grid;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.wfdet div{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.wfdet .wfn{font-weight:600;color:var(--ink)}
.drv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:10px 14px;align-items:center}
.drv .dl{font-size:13px}
.drv .dl small{display:block;color:var(--ink-3);font-size:11.5px}
.drv .bar{position:relative;height:26px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat}
.drv .bar div{position:absolute;top:3px;height:20px;border-radius:4px}
.drv .bar em{position:absolute;top:4px;font-style:normal;font-size:12px;font-weight:600;white-space:nowrap}
.drv .net .dl{font-weight:700}
.drv hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:2px 0}
.funnel{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:minmax(96px,130px) 1fr;gap:12px;align-items:center}
.fstep .fl{font-size:13px}
.fstep .fl small{display:block;color:var(--ink-3);font-size:11.5px}
.fbar{height:26px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.fbar div{height:100%;border-radius:4px}
.fbar span{position:absolute;left:8px;top:4px;font-size:12px;font-weight:600;color:var(--ink)}
.fconv{margin-left:calc(min(130px,40%) + 12px);display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.flags{display:grid;gap:8px}
.flag{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--surface-2);cursor:pointer;border:0;font:inherit;color:inherit;text-align:left;width:100%}
.flag:hover{outline:1px solid var(--line)}
.flag .fm{font-size:13px}
.flag .fm small{color:var(--ink-3)}
.showmore{font:inherit;font-weight:500;color:var(--accent);background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;justify-self:start}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;border-left:3px solid var(--warn)}
.note b{color:var(--ink)}
.foot{color:var(--ink-3);font-size:12px;max-width:80ch}
@media (prefers-reduced-motion:no-preference){.fbar div,.drv .bar div{transition:width .35s ease,left .35s ease}}
</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <div class="toprow">
    <div class="brand"><h1>Demand Midweek Review</h1><p id="subline">Weekly fundraising demand · 4 segments</p></div>
    <div class="weekpick">
      <span class="wklab">Week of</span>
      <button id="prev" type="button" aria-label="Previous week">‹</button>
      <div class="wk"><button id="wkbtn" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="wktxt"></span><span class="car" aria-hidden="true">▾</span></button>
        <div class="wkmenu" id="wkmenu" role="listbox" aria-label="Choose week" hidden></div></div>
      <button id="next" type="button" aria-label="Next week">›</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"></main>
</div>

<div id="loading" class="loadmsg">Loading latest data…</div>
<script>
(async function start(){
  const load=document.getElementById('loading');
  try{const r=await fetch('/api/data',{cache:'no-store'});
    if(!r.ok)throw new Error('Server error '+r.status+': '+(await r.text()).slice(0,200));
    const data=await r.json();load.hidden=true;boot(data);}
  catch(e){load.textContent='Could not load data. '+e.message+' Refresh the page to try again.';}
})();

function boot(DATA){
const SEGS=[
  {id:'pm',name:'Personal Medical',short:'Pers. Medical',c:'--s1'},
  {id:'pnm',name:'Personal Non-Medical',short:'Pers. Non-Med',c:'--s2'},
  {id:'ngm',name:'NGO Medical',short:'NGO Medical',c:'--s3'},
  {id:'ngnm',name:'NGO Non-Medical',short:'NGO Non-Med',c:'--s4'}];
const W=DATA.weeks, N=W.length;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const wd=i=>{const [y,m,d]=W[i].split('-').map(Number);return {y,m,d}};
const wkLabel=(i,yr)=>{const {y,m,d}=wd(i);return d+' '+MON[m-1]+(yr?' '+y:'')};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- derive ----------
const div=(a,b)=>a.map((x,i)=>(x!=null&&b[i])?x/b[i]:null);
function derive(r){
  const d={...r};
  d.ats=div(r.don,r.orders); d.conv=div(r.orders,r.uv); d.rpu=div(r.don,r.uv);
  d.tipShare=div(r.tipOrders,r.orders); d.tipRate=div(r.tip,r.don); d.avgTip=div(r.tip,r.tipOrders);
  d.opd=div(r.orders,r.donors); d.vpu=div(r.views,r.uv);
  d.f1=div(r.cart,r.init); d.f2=div(r.ocreated,r.cart); d.f3=div(r.placed,r.ocreated); d.fAll=div(r.placed,r.init);
  d.donPerLive=div(r.don,r.live); d.avgDays=div(r.liveDays,r.live); d.raisedLive=div(r.raised,r.live);
  return d;
}
const D={}; SEGS.forEach(s=>D[s.id]=derive(DATA.seg[s.id]));
// total across segments (additive metrics only)
(()=>{const t={};const add=['views','uv','donors','orders','don','tipOrders','tip','init','cart','ocreated','placed','raised','approved','live','liveDays'];
  add.forEach(k=>t[k]=W.map((_,i)=>SEGS.reduce((a,s)=>a+(DATA.seg[s.id][k][i]||0),0)));
  D.all=derive(t);})();

// ---------- format ----------
function inr(v,dp){if(v==null||!isFinite(v))return '–';const a=Math.abs(v);
  if(a>=1e7)return '₹'+(v/1e7).toFixed(dp??2)+' Cr';
  if(a>=1e5)return '₹'+(v/1e5).toFixed(dp??1)+' L';
  if(a>=1e3)return '₹'+(v/1e3).toFixed(dp??1)+'K';
  return '₹'+Math.round(v).toLocaleString('en-IN');}
const inrAx=v=>inr(v,v>=1e7?1:v>=1e5?0:0).replace('.0 ',' ');
const rup=v=>v==null?'–':'₹'+Math.round(v).toLocaleString('en-IN');
function num(v){if(v==null||!isFinite(v))return '–';const a=Math.abs(v);
  if(a>=1e5)return (v/1e5).toFixed(2)+' L';if(a>=1e4)return (v/1e3).toFixed(1)+'K';return Math.round(v).toLocaleString('en-IN');}
const pct=(v,dp=1)=>v==null||!isFinite(v)?'–':(v*100).toFixed(dp)+'%';
const dec=(v,dp=2)=>v==null?'–':v.toFixed(dp);
const FMT={inr,rup,num,pct,dec,int:v=>v==null?'–':Math.round(v).toLocaleString('en-IN')};

// ---------- stats ----------
const avg4=(a,i)=>{const s=a.slice(Math.max(0,i-4),i).filter(x=>x!=null);return s.length?s.reduce((p,c)=>p+c,0)/s.length:null};
// ratio metrics: 4-wk ratio of sums
const RATIO={ats:['don','orders'],conv:['orders','uv'],rpu:['don','uv'],tipShare:['tipOrders','orders'],tipRate:['tip','don'],avgTip:['tip','tipOrders'],
  f1:['cart','init'],f2:['ocreated','cart'],f3:['placed','ocreated'],fAll:['placed','init'],donPerLive:['don','live'],avgDays:['liveDays','live'],raisedLive:['raised','live'],opd:['orders','donors'],vpu:['views','uv']};
function base4(d,k,i){if(RATIO[k]){const [a,b]=RATIO[k];const A=avg4(d[a],i),B=avg4(d[b],i);return A!=null&&B?A/B:null}return avg4(d[k],i)}
const chg=(v,b)=>(v==null||b==null||b===0)?null:v/b-1;
const roll4=a=>a.map((_,i)=>i<3?null:a.slice(i-3,i+1).reduce((p,c)=>p+(c||0),0)/4);

function chip(c,label,invert){
  if(c==null)return `<span class="chip"><span class="k">${label}</span> –</span>`;
  const g=invert?-c:c; let cls='',ic='●';
  if(g>=0.05){cls='good';ic='▲'}else if(g<=-0.15){cls='crit';ic='▼'}else if(g<=-0.05){cls='warn';ic='▼'}else{ic=c>=0?'▲':'▼'}
  if(invert&&cls)ic=c>0?'▲':'▼';
  return `<span class="chip ${cls}"><span class="ic" aria-hidden="true">${ic}</span><span class="k">${label}</span> ${c>0?'+':''}${(c*100).toFixed(0)}%</span>`;
}

// ---------- charts ----------
function niceTicks(min,max,n=4){if(max===min){max=min+1}const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)||10*mag;const t=[];for(let v=Math.floor(min/step)*step;v<max+step-1e-9;v+=step)t.push(+v.toFixed(10));return t}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* line chart: opts {series:[{name,vals,color,dash,width}], fmt, height, sel, from, zero, compact, bars:[{name,vals,color}] (stacked)} */
function chart(el,o){
  const draw=()=>{
    if(o.fill)el.innerHTML='';const Wd=el.clientWidth||600,H=o.fill?Math.max(o.height||220,el.clientHeight):(o.height||220),compact=o.compact;
    const pl=compact?40:56,pr=12,pt=10,pb=compact?20:24,iw=Wd-pl-pr,ih=H-pt-pb;
    const from=o.from||0,to=N-1,idx=[];for(let i=from;i<=to;i++)idx.push(i);
    let vals=[];
    if(o.bars){idx.forEach(i=>vals.push(o.bars.reduce((a,b)=>a+(b.vals[i]||0),0)))}
    o.series&&o.series.forEach(s=>idx.forEach(i=>{if(s.vals[i]!=null)vals.push(s.vals[i])}));
    let mn=Math.min(...vals),mx=Math.max(...vals);if(o.zero||o.bars)mn=0;else{const pad=(mx-mn)*.08;mn=Math.max(0,mn-pad);mx+=pad}
    let clipped=false;
    if(o.robust&&o.series){const mv=idx.map(i=>o.series[0].vals[i]).filter(v=>v!=null).sort((a,b)=>a-b);const p90=mv[Math.floor(mv.length*.9)];
      const others=o.series.slice(1).flatMap(se=>idx.map(i=>se.vals[i]).filter(v=>v!=null));
      const cap=Math.max(p90*1.5,(o.series[0].vals[o.sel]||0)*1.15,...others.map(v=>v*1.05));if(mx>cap){mx=cap;clipped=true}}

  let drv='';WF=null;
  if(D0&&uv0&&c0&&a0&&D1){
    const L=Math.log(D1/D0),parts=[Math.log(uv1/uv0),Math.log(c1/c0),Math.log(a1/a0)],dD=D1-D0;
    const amt=parts.map(p=>L?dD*p/L:0);
    const drivers=[
      {n:'Traffic',m:'Visitors',c:chg(uv1,uv0),a:amt[0],det:`${num(uv1)} visitors vs ${num(uv0)} avg`},
      {n:'Conversion',m:'Orders ÷ visitors',c:chg(c1,c0),a:amt[1],det:`${pct(c1,2)} vs ${pct(c0,2)} avg`},
      {n:'Ticket size',m:'₹ per order',c:chg(a1,a0),a:amt[2],det:`${rup(a1)} vs ${rup(a0)} avg`}];
    WF={D0,D1,drivers,col};
    const big=[...drivers].sort((x,y)=>Math.abs(y.a)-Math.abs(x.a))[0];
    const up=dD>=0,sameDir=drivers.filter(x=>Math.sign(x.a)===Math.sign(dD));
    const why={Traffic:up?'more visitors':'fewer visitors',Conversion:up?'better conversion':'weaker conversion','Ticket size':up?'bigger donations per order':'smaller donations per order'};
    const bigTxt=Math.sign(big.a)===Math.sign(dD)?`Biggest reason: <b>${why[big.n]}</b> (${big.a>=0?'+':'−'}${inr(Math.abs(big.a))}).`:`Mostly driven by ${sameDir.map(x=>why[x.n]).join(' and ')}.`;
    drv=`<p class="wfhead">Donations are <b class="${up?'upc':'dnc'}">${up?'up':'down'} ${inr(Math.abs(dD))} (${up?'+':'−'}${Math.abs(chg(D1,D0)*100).toFixed(0)}%)</b> vs the 4-week average. ${bigTxt}</p>
    <div class="chart" id="wf"></div>
    <div class="wfdet">${drivers.map(x=>`<div><span class="wfn">${x.n}</span><span>${x.det}</span>${chip(x.c,'')}</div>`).join('')}</div>`;
  }
  h+=`<section class="panel col"><div class="ph"><div><h3>Donations trend</h3><p>Weekly, excl. tips. Click to jump to a week.</p></div></div>
   <div class="legend"><span><i style="background:${col}"></i>Weekly</span><span><i class="dash"></i>4-week rolling avg</span></div><div class="chart fill" id="trend"></div>
   ${(()=>{const past=d.don.slice(Math.max(0,i-51),i+1).filter(v=>v!=null);const srt=[...past].sort((a,b)=>a-b);const med=srt[Math.floor(srt.length/2)];
     let bi=Math.max(0,i-51);for(let k=bi;k<=i;k++)if(d.don[k]>d.don[bi])bi=k;
     return `<div class="tstats"><div><span>This week</span><b>${inr(d.don[i])}</b></div><div><span>4-wk avg</span><b>${inr(avg4(d.don,i))}</b></div><div><span>52-wk median</span><b>${inr(med)}</b></div><div><span>Best week</span><b>${inr(d.don[bi])}</b><small>${wkLabel(bi,true)}</small></div></div>`})()}
  </section>`;
  // donors vs ticket size
  {const dc=chg(d.donors[i],avg4(d.donors,i)),tc=chg(d.ats[i],base4(d,'ats',i));
   const word=c=>c==null?'':Math.abs(c)<0.05?'about the same as':c>0?'more than':'fewer than';
   const verdict=(dc!=null&&tc!=null)?(Math.abs(dc)<0.05&&Math.abs(tc)<0.05?'Both about normal this week.':
     (Math.abs(dc)>=Math.abs(tc)?(dc<0?'The drop is mainly <b>fewer donors</b>.':'The lift is mainly <b>more donors</b>.'):(tc<0?'The drop is mainly <b>smaller donations</b>.':'The lift is mainly <b>bigger donations</b>.'))):'';
   h+=`<section class="panel"><div class="ph"><div><h3>Donors vs ticket size</h3><p>Are we losing people, or are people giving less? Last 12 weeks; the dashed line is the 4-week average. Click a bar to jump to that week.</p></div></div>
   <p class="wfhead"><b>${num(d.donors[i])}</b> donors ${chip(dc,'vs 4-wk')} gave <b>${rup(d.ats[i])}</b> per donation ${chip(tc,'vs 4-wk')}. ${verdict}</p>
   <div class="grid2"><div class="mini"><h4>Unique donors <span class="avgk">- - 4-wk avg ${num(avg4(d.donors,i))}</span></h4><div class="chart" id="bDonors"></div></div><div class="mini"><h4>Avg ticket size <span class="avgk">- - 4-wk avg ${rup(base4(d,'ats',i))}</span></h4><div class="chart" id="bTicket"></div></div></div></section>`;}
  // drivers minis
  h+=`<section class="panel"><div class="ph"><div><h3>The three drivers, week by week</h3></div></div><div class="grid3">
   ${[['uv','Unique visitors',num],['conv','Order conversion',v=>pct(v,1)],['ats','Avg ticket size',rup]].map(([k,l,f])=>`<div class="mini"><h4>${l}</h4><div class="mv">${f(d[k][i])} this week · ${f(base4(d,k,i))} 4-wk avg</div><div class="chart" data-mini="${k}"></div></div>`).join('')}</div></section>`;
  // funnel
  const steps=[['Started donating','Contribution initiated',d.init[i]],['Cart created','',d.cart[i]],['Order created','',d.ocreated[i]],['Paid','Order placed',d.placed[i]]];
  const rates=[['f1','Start → cart'],['f2','Cart → order'],['f3','Order → paid']];
  let fun=`<div class="funnel">`;
  steps.forEach((st,k)=>{const w=Math.min(100,st[2]/steps[0][2]*100);
    fun+=`<div class="fstep"><div class="fl">${st[0]}${st[1]?`<small>${st[1]}</small>`:''}</div><div class="fbar"><div style="width:${w}%;background:${col};opacity:${1-k*.18}"></div><span>${FMT.int(st[2])}</span></div></div>`;
    if(k<3){const r=rates[k];fun+=`<div class="fconv">↓ ${pct(d[r[0]][i],0)} <span style="color:var(--ink-3)">${r[1]}</span> ${chip(chg(d[r[0]][i],base4(d,r[0],i)),'vs 4-wk')}</div>`}});
  fun+=`</div>`;
  const over=d.f2[i]>1;
  h+=`<div class="grid2"><section class="panel"><div class="ph"><div><h3>Checkout funnel</h3><p>Where donors drop off, this week. End-to-end: <b>${pct(d.fAll[i],0)}</b> of people who start end up paying.</p></div></div>${fun}
   ${over?`<p class="note" style="margin:12px 0 0"><b>Data check:</b> more orders than carts this week (cart → order above 100%). Orders can probably be created without a cart; worth confirming with the data team.</p>`:''}</section>
  <section class="panel"><div class="ph"><div><h3>Tips</h3><p>Tip revenue is Ketto's own income, separate from donations.</p></div></div>
   <div class="tipgrid">
   ${[['Tip revenue',inr(d.tip[i]),chg(d.tip[i],base4(d,'tip',i))],['Orders with a tip',pct(d.tipShare[i],0),chg(d.tipShare[i],base4(d,'tipShare',i))],['Avg tip',rup(d.avgTip[i]),chg(d.avgTip[i],base4(d,'avgTip',i))],['Tip % of donations',pct(d.tipRate[i],1),chg(d.tipRate[i],base4(d,'tipRate',i))]]
     .map(r=>`<div><div class="eyebrow" style="text-transform:none;letter-spacing:0;font-weight:500;font-size:12px">${r[0]}</div><div style="font-family:var(--display);font-size:22px;font-weight:700">${r[1]}</div>${chip(r[2],'vs 4-wk')}</div>`).join('')}</div>
   <div class="chart" id="tipc" style="margin-top:14px"></div></section></div>`;
  // supply
  const brk=id==='ngnm';
  h+=`<section class="panel"><div class="ph"><div><h3>Campaign supply</h3><p>How many campaigns are there to donate to, and how much each one earns.</p></div></div>
   ${brk?`<p class="note" style="margin:0 0 12px"><b>Definition break:</b> campaigns live drops from about 18,500 to about 500 in Jan 2026 and jumps around after that. That points to a change in how live campaigns were counted, not a real collapse. Compare only weeks after the change.</p>`:''}
   <div class="grid4">${[['live','Campaigns live',FMT.int],['raised','New campaigns raised',FMT.int],['approved','Campaigns approved',FMT.int],['donPerLive','Donations per live campaign',rup]]
     .map(([k,l,f])=>`<div class="mini"><h4>${l}</h4><div class="mv">${f(d[k][i])} · ${chip(chg(d[k][i],base4(d,k,i)),'vs 4-wk')}</div><div class="chart" data-mini="${k}"></div></div>`).join('')}</div></section>`;
  // detail table
  const cols=[];for(let k=Math.max(0,i-7);k<=i;k++)cols.push(k);
  const TR=[['Traffic'],['views','Campaign views',num],['uv','Unique visitors',num],['vpu','Views per visitor',v=>dec(v)],
    ['Donations'],['donors','Unique donors',num],['orders','Total orders',num],['don','Donations (excl. tip)',inr],['opd','Orders per donor',v=>dec(v)],['ats','Avg ticket size',rup],['rpu','Revenue per visitor',rup],['conv','Order conversion',v=>pct(v,2)],
    ['Tips'],['tipOrders','Tipped orders',FMT.int],['tipShare','% orders tipped',v=>pct(v,0)],['tip','Tip amount',inr],['avgTip','Avg tip',rup],
    ['Funnel'],['init','Contribution initiated',FMT.int],['f1','Start → cart',v=>pct(v,0)],['cart','Cart created',FMT.int],['f2','Cart → order',v=>pct(v,0)],['ocreated','Order created',FMT.int],['f3','Order → paid',v=>pct(v,0)],['placed','Order placed',FMT.int],
    ['Campaigns'],['live','Campaigns live',FMT.int],['liveDays','Campaign days live',FMT.int],['avgDays','Avg days live',v=>dec(v,1)],['approved','Campaigns approved',FMT.int],['raised','Campaigns raised',FMT.int],['raisedLive','Raised ÷ live',v=>pct(v,1)],['donPerLive','Donations per live campaign',rup]];
  h+=`<section class="panel"><div class="ph"><div><h3>All metrics · last 8 weeks</h3><p>Every row from the sheet. The selected week is highlighted.</p></div></div><div class="tablewrap"><table><thead><tr><th>Metric</th>${cols.map(k=>`<th class="${k===i?'sel':''}">${wkLabel(k)}</th>`).join('')}<th>4-wk avg</th><th>vs 4-wk</th></tr></thead><tbody>`;
  TR.forEach(r=>{if(r.length===1){h+=`<tr class="grp"><td colspan="${cols.length+3}">${r[0]}</td></tr>`;return}
    const [k,l,f]=r;const b=base4(d,k,i);h+=`<tr><td>${l}</td>${cols.map(c=>`<td class="${c===i?'sel':''}">${f(d[k][c])}</td>`).join('')}<td>${f(b)}</td><td>${chip(chg(d[k][i],b),'')}</td></tr>`});
  h+=`</tbody></table></div></section>`;
  return {h,after(){
    barsChart(document.getElementById('bDonors'),{vals:d.donors,sel:i,avg:avg4(d.donors,i),fmt:num,color:col,label:'Unique donors'});
    barsChart(document.getElementById('bTicket'),{vals:d.ats,sel:i,avg:base4(d,'ats',i),fmt:v=>v>=1e4?inr(v):rup(v),tfmt:rup,color:col,label:'Avg ticket size'});
    chart(document.getElementById('trend'),{series:[{name:'Donations',vals:d.don,color:col,area:true},{name:'4-wk avg',vals:roll4(d.don),color:cssv('--ink-3'),dash:true,width:1.5}],fmt:inrAx,tfmt:v=>inr(v),height:280,robust:true,sel:i,onPick:pick,label:'Weekly donations'});
    chart(document.getElementById('tipc'),{series:[{name:'Tip revenue',vals:d.tip,color:col,area:true}],fmt:inrAx,tfmt:v=>inr(v),height:150,sel:i,onPick:pick,compact:true,label:'Weekly tip revenue'});
    const mf={uv:v=>num(v),conv:v=>pct(v,1),ats:v=>rup(v),live:v=>FMT.int(v),raised:v=>FMT.int(v),approved:v=>FMT.int(v),donPerLive:v=>rup(v)};
    document.querySelectorAll('[data-mini]').forEach(el=>{const k=el.dataset.mini;
      chart(el,{series:[{name:el.parentElement.querySelector('h4').textContent,vals:d[k],color:col}],fmt:mf[k],height:140,sel:i,onPick:pick,compact:true,label:k,from:(brk&&k==='live')?Math.max(0,W.findIndex(w=>w>='2026-01-05')):0})});
  }};
}

function render(){
  document.getElementById('wktxt').textContent=wkLabel(sel,true);document.getElementById('prev').disabled=sel===0;document.getElementById('next').disabled=sel===N-1;
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.s===seg));
  const main=document.getElementById('main');const p=seg==='overview'?overview():segment(seg);
  main.innerHTML=p.h+`<p class="foot">Source: Supabase table demand_weekly_summary, ${N} weeks from w/c ${wkLabel(0,true)} to w/c ${wkLabel(N-1,true)}. Loaded ${new Date(DATA.fetchedAt||Date.now()).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}. Ratios and 4-week averages are calculated from the raw weekly counts.</p>`;
  const d=seg==='overview'?D.all:D[seg];
  main.querySelectorAll('[data-spark]').forEach(el=>spark(el,d[el.dataset.spark],sel,el.dataset.color));
  p.after();
  main.querySelectorAll('[data-go]').forEach(el=>{el.addEventListener('click',()=>go(el.dataset.go));el.addEventListener('keydown',e=>{if(e.key==='Enter')go(el.dataset.go)})});
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>document.querySelectorAll('.chart,.spark').forEach(el=>el._draw&&el._draw()),120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
document.getElementById('subline').textContent=`Weekly fundraising demand · 4 segments · ${N} weeks · latest w/c ${wkLabel(N-1,true)}`;
}
</script>
